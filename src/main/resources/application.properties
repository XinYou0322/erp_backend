spring.application.name=erp-backend
server.port=8080
front.end.host=http://localhost:5173
######## 1. 資料庫基本連線 (SQL Server) ##########
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=iSpan_Project;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=000000

######## 2. JPA / Hibernate 自動建表 ##########
spring.jpa.hibernate.ddl-auto=create

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.separator=GO
spring.sql.init.schema-locations=classpath:database-upgrade.sql
spring.jpa.show-sql=true

######## 3. 檔案上傳限制與進階設定 ##########
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=80MB
spring.mvc.hiddenmethod.filter.enabled=true
######## 4. 控制台彩色日誌顯示 ##########
spring.output.ansi.enabled=always

######## 5. ECPay 測試環境 ##########
# 【本次新增：ECPay 測試金流】以下是綠界官方公開測試商店資料，只可用於 stage 測試環境。
ecpay.payment-url=https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5
ecpay.merchant-id=3002607
ecpay.hash-key=pwFHCqoQZGmho4w6
ecpay.hash-iv=EkRm7iFT261dpevs
# ReturnURL 必須讓 ECPay 伺服器連得到；跨機測試時請改成後端公開 HTTPS 網址。
ecpay.backend-base-url=http://localhost:8080
ecpay.frontend-base-url=${front.end.host}

