# Application
spring.application.name=erp-backend
server.port=${SERVER_PORT:8080}

# Public URLs
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}
front.end.host=${app.frontend-url}

# SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=iSpan_Project;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:000000}

# JPA and data initialization
# Normal startup preserves data. Use the reset profile only for an intentional rebuild.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Web and uploads
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=80MB
spring.mvc.hiddenmethod.filter.enabled=true

# Console
spring.output.ansi.enabled=always

# ECPay stage
# Defaults are ECPay's public test merchant values and can be overridden by environment variables.
ecpay.payment-url=${ECPAY_PAYMENT_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
ecpay.merchant-id=${ECPAY_MERCHANT_ID:3002607}
ecpay.hash-key=${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
ecpay.hash-iv=${ECPAY_HASH_IV:EkRm7iFT261dpevs}
ecpay.backend-base-url=${app.backend-url}
ecpay.frontend-base-url=${app.frontend-url}

